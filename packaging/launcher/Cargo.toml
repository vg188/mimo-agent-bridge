[package]
name = "mimo-agent-bridge-launcher"
version = "0.1.0"
edition = "2021"

[dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
# optional icon embed on Windows

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
